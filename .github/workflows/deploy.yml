name: Sync SUT REG & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # รันอัตโนมัติวันละ 1 ครั้ง เวลา 00:00 น. (เที่ยงคืนเวลาไทย = 17:00 UTC) จะเอาไป ลบกับ 7 ชั้วโมง (เวลาไทยต้องการ) จะได้เวลา UTC 17:00 น. (เที่ยงคืนเวลาไทย)
    - cron: '0 17 * * *'
# ทุก 3 ชั่วโมง: - cron: '0 */3 * * *'
# ทุก 12 ชั่วโมง: - cron: '0 */12 * * *'
# # วันละ 1 ครั้ง (เช่น เที่ยงคืน): - cron: '0 17 * * *' (เวลา UTC 17:00 = เที่ยงคืนไทย)
# เวลาที่ต้องการให้รัน (เวลาไทย)	แปลงเป็นเวลา UTC	โค้ดที่ต้องใส่ใน cron:
# เที่ยงคืน (00:00 น.) (ค่าปัจจุบันที่ตั้งไว้)	17:00 UTC	- cron: '0 17 * * *'
# 6 โมงเช้า (06:00 น.) ก่อนเริ่มวันใหม่	23:00 UTC	- cron: '0 23 * * *'
# เที่ยงวัน (12:00 น.)	05:00 UTC	- cron: '0 5 * * *'
# บ่าย 3 โมง (15:00 น.)	08:00 UTC	- cron: '0 8 * * *'

  workflow_dispatch: # Allows manual trigger from GitHub UI
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run SUT REG Sync (Scrape latest courses)
        run: |
          cd backend
          go run ./cmd/sync

      - name: Commit updated courses.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/courses.json || true
          git diff --staged --quiet || (git commit -m "chore(data): auto-update courses.json from SUT REG" && git push)

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies & Build frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: sync-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
